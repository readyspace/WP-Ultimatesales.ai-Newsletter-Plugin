name: Isolated PHP checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution PHP packages
        run: sudo apt-get update && sudo apt-get install -y php-cli php-xml
      - run: php --version
      - run: bash scripts/test.sh
      - run: bash scripts/package.sh

name: Prepare newsletter 0.4.1 SVN review
on:
  push:
    branches: [codex/prepare-newsletter-041-svn]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Subversion on the disposable runner
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Prepare and inspect without publishing
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/newsletter-041"
          mkdir -p "$root/source" "$root/baseline" "$root/report" "$root/svn-config"
          chmod 700 "$root" "$root/svn-config"
          test "$(git rev-parse 461a2d0f0b11f9ab5839f6143a9803df4ff6b954^{tree})" = 2b6f0668e27017fa29b4bf42cfafe6fb215d3217
          git merge-base --is-ancestor 461a2d0f0b11f9ab5839f6143a9803df4ff6b954 HEAD
          git diff --exit-code 461a2d0f0b11f9ab5839f6143a9803df4ff6b954 HEAD -- cleverspeed-newsletter scripts/package.sh
          git archive 634fdbf697d3552bc2949823c03834e427dcc808 cleverspeed-newsletter | tar -x -C "$root/baseline"
          git archive 461a2d0f0b11f9ab5839f6143a9803df4ff6b954 | tar -x -C "$root/source"
          git rev-parse 461a2d0f0b11f9ab5839f6143a9803df4ff6b954^{tree} | tee "$root/report/source-tree.txt"
          cd "$root/source"
          bash scripts/package.sh --submission | tee "$root/report/package.txt"
          package="dist/readyspace-newsletter-for-ultimatesales-ai-0.4.1.zip"
          printf '%s  %s\n' 'd061dfa8a11080e8c6fd96e332bb2c2af85561419cfcdc47d65bfe3e33e6996a' "$package" | sha256sum --check
          unzip -q "$package" -d "$root/package"
          svn checkout --non-interactive --no-auth-cache --config-dir "$root/svn-config" https://plugins.svn.wordpress.org/readyspace-newsletter-for-ultimatesales-ai/ "$root/svn"
          cd "$root/svn"
          svn info | tee "$root/report/svn-info.txt"
          svn status | tee "$root/report/svn-status-before.txt"
          test ! -s "$root/report/svn-status-before.txt"
          svn list tags | tee "$root/report/existing-tags.txt"
          if grep -qx '0.4.1/' "$root/report/existing-tags.txt"; then echo '0.4.1 already exists; stop.' >&2; exit 1; fi
          diff -rq "$root/baseline/cleverspeed-newsletter" trunk
          cp -R "$root/package/readyspace-newsletter-for-ultimatesales-ai/." trunk/
          svn add trunk/includes/sending-configuration-status.php
          svn copy trunk tags/0.4.1
          svn status | tee "$root/report/svn-status.txt"
          svn diff --show-copies-as-adds > "$root/report/svn-diff.txt"
          cat "$root/report/svn-diff.txt"
          svn diff --summarize | tee "$root/report/svn-diff-summary.txt"
          diff -rq "$root/package/readyspace-newsletter-for-ultimatesales-ai" trunk
          diff -rq trunk tags/0.4.1
          (cd trunk && find . -type f -print0 | sort -z | xargs -0 sha256sum) | tee "$root/report/trunk-manifest-sha256.txt"
          (cd tags/0.4.1 && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$root/report/tag-manifest-sha256.txt"
          diff -u "$root/report/trunk-manifest-sha256.txt" "$root/report/tag-manifest-sha256.txt"
          test -f trunk/cleverspeed-newsletter.php
          test ! -d trunk/readyspace-newsletter-for-ultimatesales-ai
          export LC_ALL=C
          svn status | sort > "$root/status"
          printf '%s\n' 'A  +    tags/0.4.1' 'M  +    tags/0.4.1/cleverspeed-newsletter.php' 'A       tags/0.4.1/includes/sending-configuration-status.php' 'M  +    tags/0.4.1/readme.txt' 'M       trunk/cleverspeed-newsletter.php' 'A       trunk/includes/sending-configuration-status.php' 'M       trunk/readme.txt' | sort > "$root/expected-status"
          diff -u "$root/expected-status" "$root/status"
          export WPORG_SVN_PASSWORD='DUMMY-FICTIONAL-DRY-RUN'
          env -u WPORG_SVN_PASSWORD svn export --non-interactive --no-auth-cache --config-dir "$root/svn-config" https://plugins.svn.wordpress.org/readyspace-newsletter-for-ultimatesales-ai/trunk "$root/remote-trunk"
          env -u WPORG_SVN_PASSWORD diff -rq "$root/baseline/cleverspeed-newsletter" "$root/remote-trunk"
          env -u WPORG_SVN_PASSWORD svn status --show-updates --xml --non-interactive --no-auth-cache --config-dir "$root/svn-config" trunk tags > "$root/remote-status.xml"
          env -u WPORG_SVN_PASSWORD python3 -c 'import sys,xml.etree.ElementTree as E; t=E.parse(sys.argv[1]); bad=[x for x in t.findall(".//entry") if any(r.get(k,"none") not in ("none","normal") for r in x.findall("repos-status") for k in ("item","props"))]; print("Remote changes since checkout:", [x.get("path") for x in bad]); sys.exit(bool(bad))' "$root/remote-status.xml"
          env -u WPORG_SVN_PASSWORD svn list --non-interactive --no-auth-cache --config-dir "$root/svn-config" https://plugins.svn.wordpress.org/readyspace-newsletter-for-ultimatesales-ai/tags > "$root/final-tags"
          if grep -qx '0.4.1/' "$root/final-tags"; then echo 'Release tag 0.4.1 exists; stop and inspect remote state.' >&2; exit 1; fi
          env -u WPORG_SVN_PASSWORD svn status | sort > "$root/final-status"
          env -u WPORG_SVN_PASSWORD diff -u "$root/expected-status" "$root/final-status"
          unset WPORG_SVN_PASSWORD
          echo 'PASS: all release precommit checks, no SVN commit performed'
          tar -C "$root" -czf "$RUNNER_TEMP/newsletter-041-prepared-svn.tar.gz" svn report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsletter-041-svn-review
          path: ${{ runner.temp }}/newsletter-041/report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: newsletter-041-prepared-svn
          path: ${{ runner.temp }}/newsletter-041-prepared-svn.tar.gz
          if-no-files-found: error
